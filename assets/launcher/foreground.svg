<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Adaptive icon foreground for the A안 Korean launcher icon.
    Transparent background (the green is supplied by adaptive_icon_background).
    The speech bubble + 한t is scaled to ~0.66 around the centre so it stays
    inside the adaptive safe zone (central ~66%) and is not clipped by the mask.
  -->
  <g transform="translate(512 512) scale(0.66) translate(-512 -512)">
    <g fill="#232323">
      <rect x="96" y="88" width="832" height="720" rx="180" ry="180"/>
      <path d="M298 770 L240 908 L440 784 Z"/>
    </g>
    <text x="512" y="436" text-anchor="middle" dominant-baseline="central"
          font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Microsoft YaHei',sans-serif"
          font-weight="800" font-size="356" letter-spacing="-6" fill="#FCFCF8">&#54620;t</text>
  </g>
</svg>
